[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imgaug"
version = "0.4.1"
description = "Patched imgaug build for Supervisely data-nodes"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
dependencies = [
  "six",
  "numpy>=1.15,<2",
  "scipy",
  "Pillow",
  "matplotlib",
  "scikit-image>=0.14.2,<1",
  "opencv-python<5",
  "imageio",
  "Shapely",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["imgaug*"]

[tool.setuptools.package-data]
imgaug = ["*.ttf", "*.png", "*.jpg", "*.json", "external/*.md"]
